name: build-and-test

# Builds the pinned llama.cpp with the PocketLLM engine patch on Linux, macOS and
# Windows, runs the unit tests, checks the engine (activity + identical greedy output),
# and uploads the binaries so they can be copied onto a PocketLLM drive.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # pushes run Linux only (macOS minutes count 10x, Windows 2x on private repos);
        # run the workflow manually for the full three-OS matrix
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: .build/llama.cpp/.git
          key: llama-src-${{ runner.os }}-${{ hashFiles('scripts/build_llamacpp.sh') }}

      - name: Build llama.cpp + engine (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then scripts/build_llamacpp.sh cpu; else scripts/build_llamacpp.sh auto; fi

      - name: Build llama.cpp + engine (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_llamacpp.ps1 -Backend cpu

      - name: Platform tag
        id: tag
        run: echo "tag=$(python -c 'from pocketllm import runtime; print(runtime.platform_tag())')" >> "$GITHUB_OUTPUT"

      - name: Generate random-weight test models
        run: |
          python -m pip install --quiet numpy pyyaml
          python scripts/make_test_models.py .build/llama.cpp models small
          for m in dense moe; do
            bin/${{ steps.tag.outputs.tag }}/llama-quantize models/test-$m-f16.gguf models/test-$m-Q4_K_M.gguf Q4_K_M
            rm models/test-$m-f16.gguf
          done

      - name: Unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || { python scripts/ci_annotate.py test.log; exit 1; }

      - name: Engine check (activity + identical output)
        run: python scripts/ci_engine_check.py bin/${{ steps.tag.outputs.tag }} models/test-moe-Q4_K_M.gguf

      - name: CLI smoke test
        run: |
          python -m pocketllm profile --no-read-test
          python -m pocketllm plan --local-only --no-read-test -v
          POCKETLLM_BIN=bin/${{ steps.tag.outputs.tag }} python -m pocketllm requant models/test-moe-Q4_K_M.gguf \
            --recipe experts-q2 --out requant-test/test-moe-E2R8.gguf
          python -m pocketllm inspect requant-test/test-moe-E2R8.gguf

      - name: Portable Python for the drive (runs PocketLLM without a system Python)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_python.py drive --platforms ${{ steps.tag.outputs.tag }}
          if [ "$RUNNER_OS" = "Windows" ]; then PY=drive/python/${{ steps.tag.outputs.tag }}/python.exe
          else PY=drive/python/${{ steps.tag.outputs.tag }}/bin/python3; fi
          "$PY" -I -c "import sys; print(sys.version)"
          "$PY" -m pocketllm profile --no-read-test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pocketllm-bin-${{ steps.tag.outputs.tag }}
          path: bin/${{ steps.tag.outputs.tag }}
          retention-days: 30
